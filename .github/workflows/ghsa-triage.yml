name: Triage GHSA

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.github/scripts/ghsa-triage/.nvmrc'
          cache: 'npm'
          cache-dependency-path: .github/scripts/ghsa-triage/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts/ghsa-triage

      - name: Run tests
        run: npm test
        working-directory: .github/scripts/ghsa-triage

  triage:
    name: Triage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    environment: GHSA
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.github/scripts/ghsa-triage/.nvmrc'
          cache: 'npm'
          cache-dependency-path: .github/scripts/ghsa-triage/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts/ghsa-triage

      - name: Triage security advisories
        run: node src/index.js
        working-directory: .github/scripts/ghsa-triage
        env:
          GITHUB_TOKEN: ${{ secrets.GHSA_GITHUB_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
