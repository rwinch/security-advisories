name: Test Triage Security Advisories

on:
  workflow_call:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.github/scripts/triage-security-advisories/.nvmrc'
          cache: 'npm'
          cache-dependency-path: .github/scripts/triage-security-advisories/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .github/scripts/triage-security-advisories

      - name: Run tests
        run: npm test
        working-directory: .github/scripts/triage-security-advisories
